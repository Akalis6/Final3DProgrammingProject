<!DOCTYPE html>
<html>
<head>
  <title>BabylonJS Rain and Grass</title>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
  <canvas id="renderCanvas" style="width:100%;height:100%"></canvas>

  <!-- Rain Vertex Shader -->
  <script id="vertexShaderCode" type="x-shader/x-vertex">
    /* … your existing rain vertex GLSL … */
  </script>
  <!-- Rain Fragment Shader -->
  <script id="fragmentShaderCode" type="x-shader/x-fragment">
    /* … your existing rain fragment GLSL … */
  </script>
  <!-- Grass Vertex Shader -->
  <script id="grassVertexShaderCode" type="x-shader/x-vertex">
    /* … your existing grass vertex GLSL … */
  </script>
  <!-- Grass Fragment Shader -->
  <script id="grassFragmentShaderCode" type="x-shader/x-fragment">
    /* … your existing grass fragment GLSL … */
  </script>

  <!-- Main JavaScript -->
  <script>
    var canvas = document.getElementById("renderCanvas");
    var engine = new BABYLON.Engine(canvas, true);
    var rainSound, grassSound;

    var createScene = function () {
      var scene = new BABYLON.Scene(engine);

      // … your existing scene setup (camera, light, ground, rain/grass meshes) …

      // 1) Load rain sound (autoplay turned off)
      rainSound = new BABYLON.Sound("rain", "rainsounds.mp3", scene, null, {
        loop: true,
        autoplay: false,
        volume: 0.9
      });

      // 2) Load grass sound (new!)
      grassSound = new BABYLON.Sound("grass", "grassSounds.mp3", scene, null, {
        loop: true,
        autoplay: false,
        volume: 0.7
      });

      // … the rest of your createScene (rainShaderMaterial, grassShaderMaterial, animation loop) …

      return scene;
    };

    // … your existing createRainMesh, createGrassMesh, etc. …

    var scene = createScene();
    engine.runRenderLoop(function () {
      scene.render();
    });
    window.addEventListener("resize", function () {
      engine.resize();
    });

    // PLAY BOTH SOUNDS ON FIRST CLICK
    var firstClick = true;
    window.addEventListener("click", function () {
      if (firstClick) {
        if (rainSound && !rainSound.isPlaying) {
          rainSound.play();
        }
        if (grassSound && !grassSound.isPlaying) {
          grassSound.play();
        }
        firstClick = false;
      }
    });
  </script>
</body>
</html>
